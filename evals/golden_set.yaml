- id: reg-01
  type: reg
  question: What does MSHA require for moving machine parts like pulleys and flywheels?
  expected_sections:
  - '56.14107'
  expected_facts:
  - shall be guarded
  - pulleys
  must_refuse: false
  verified_by: facts found verbatim in 56.14107
- id: reg-02
  type: reg
  question: When must miners wear safety belts and lines?
  expected_sections:
  - '56.15005'
  expected_facts:
  - danger of falling
  - second person shall tend the lifeline
  must_refuse: false
  verified_by: facts found verbatim in 56.15005
- id: reg-03
  type: reg
  question: How high must berms be on haul roads?
  expected_sections:
  - '56.9300'
