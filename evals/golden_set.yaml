- id: reg-10
  type: reg
  question: What does Part 56 require for respirators when miners are exposed to dust?
  expected_sections:
  - 56.5005T
  forbidden_sections:
  - '56.5005'
  expected_facts:
  - written respiratory protection program
  - ASTM F3387-19
  notes: 56.5005 expired April 7, 2026; 56.5005T is in force.
  must_refuse: false
  verified_by: facts found verbatim in 56.5005T
- id: agg-01
  type: agg
  question: How many fatal accidents were recorded in 2023?
  must_refuse: false
  expected_value: 27
  verified_by: SELECT COUNT(*) FROM accidents WHERE SEVERITY='fatal' AND CAL_YR=2023
- id: agg-02
  type: agg
  question: How many fatalities were there in total from 2021 to 2024?
  must_refuse: false
  expected_value: 80
  verified_by: SELECT COUNT(*) FROM accidents WHERE SEVERITY='fatal'
- id: agg-03
  type: agg
  question: Which year had the most fatal accidents?
  must_refuse: false
  expected_value: 2023
  verified_by: SELECT CAL_YR FROM accidents WHERE SEVERITY='fatal' GROUP BY CAL_YR ORDER BY COUNT(*) DESC
    LIMIT 1
- id: agg-04
  type: agg
  question: What accident classification caused the most fatalities in 2023?
  must_refuse: false
  expected_value: MACHINERY
  verified_by: SELECT CLASSIFICATION FROM accidents WHERE SEVERITY='fatal' AND CAL_YR=2023 GROUP BY CLASSIFICATION
    ORDER BY COUNT(*) DESC LIMIT 1
- id: agg-05
  type: agg
  question: What is the most common accident classification overall?
  notes: Non-fatal counts describe the 3,000-row sample, not the population; say so.
  lead_phrases: &id001
  - sample
  forbidden_phrases: &id002
  - representative
  must_refuse: false
  expected_value: HANDLING OF MATERIALS
  verified_by: SELECT CLASSIFICATION FROM accidents GROUP BY CLASSIFICATION ORDER BY COUNT(*) DESC LIMIT
    1
- id: agg-06
  type: agg
  question: Which state has the most recorded accidents?
  notes: Non-fatal counts describe the 3,000-row sample, not the population; say so.
  lead_phrases: *id001
  forbidden_phrases: *id002
  must_refuse: false
  expected_value: AZ
  verified_by: SELECT m.STATE FROM accidents a JOIN mines m USING(MINE_ID) GROUP BY m.STATE ORDER BY COUNT(*)
    DESC LIMIT 1
- id: agg-07
  type: agg
  question: On average, how many days were lost in lost-time accidents?
  notes: Non-fatal counts describe the 3,000-row sample, not the population; say so.
  lead_phrases: *id001
  forbidden_phrases: *id002
  must_refuse: false
  expected_value: 64.5
  verified_by: SELECT ROUND(AVG(DAYS_LOST), 1) FROM accidents WHERE SEVERITY='lost_time'
- id: hyb-01
  type: hybrid
  question: How many fatal accidents involved conveyors, and what rule covers guarding them?
  expected_sections:
  - '56.14107'
  required_phrases: &id003
  - mention
  must_refuse: false
  expected_value: 6
  verified_by: SELECT COUNT(*) FROM accidents WHERE SEVERITY='fatal' AND NARRATIVE LIKE '%conveyor%'
- id: hyb-02
  type: hybrid
  question: Were there fatalities involving berms, and what does Part 56 require for them?
  expected_sections:
  - '56.9300'
  required_phrases: *id003
  must_refuse: false
  expected_value: 3
  verified_by: SELECT COUNT(*) FROM accidents WHERE SEVERITY='fatal' AND NARRATIVE LIKE '%berm%'
- id: hyb-03
  type: hybrid
  question: How many fatal accidents mention a harness or fall protection, and which rule applies?
  expected_sections:
  - '56.15005'
  required_phrases: *id003
  must_refuse: false
  expected_value: 3
  verified_by: SELECT COUNT(*) FROM accidents WHERE SEVERITY='fatal' AND (NARRATIVE LIKE '%fall protection%'
    OR NARRATIVE LIKE '%harness%')
- id: hyb-04
  type: hybrid
  question: How many 2023 fatalities were classified as MACHINERY, and what rule covers maintenance on
    machinery?
  expected_sections:
  - '56.14105'
  must_refuse: false
  expected_value: 11
  verified_by: SELECT COUNT(*) FROM accidents WHERE SEVERITY='fatal' AND CAL_YR=2023 AND CLASSIFICATION='MACHINERY'
